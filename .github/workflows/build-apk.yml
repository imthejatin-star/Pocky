name: Build Pocki APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pocki
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Create web directory
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Replace Android launcher icon
        run: |
          RES="android/app/src/main/res"

          # Remove Capacitor's generated adaptive launcher icons
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          # Create launcher icon folders
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Generate Android launcher icon sizes
          convert pocki-icon-1080.png -resize 48x48 "$RES/mipmap-mdpi/ic_launcher.png"
          convert pocki-icon-1080.png -resize 72x72 "$RES/mipmap-hdpi/ic_launcher.png"
          convert pocki-icon-1080.png -resize 96x96 "$RES/mipmap-xhdpi/ic_launcher.png"
          convert pocki-icon-1080.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert pocki-icon-1080.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Round launcher icon
          cp "$RES/mipmap-mdpi/ic_launcher.png" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$RES/mipmap-hdpi/ic_launcher.png" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xhdpi/ic_launcher.png" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxhdpi/ic_launcher.png" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Pocki APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Upload Pocki APK
        uses: actions/upload-artifact@v4
        with:
          name: pocki-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
